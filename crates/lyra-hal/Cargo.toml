[package]
name = "lyra-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lyra-core = { path = "../lyra-core" }

# CoreAudio exists only on Apple targets — keep the crate in the workspace
# everywhere, but pull the bindings only where they exist; the lib itself
# compiles to an empty stub off macOS (see lib.rs's crate-level cfg).
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2.18"

[lints]
workspace = true

# lyra-core is used only under the macOS cfg (lib.rs is a stub off-Apple);
# udeps runs on Linux and can't see through target-gated code.
[package.metadata.cargo-udeps.ignore]
normal = ["lyra-core"]
