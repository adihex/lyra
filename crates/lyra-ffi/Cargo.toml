[package]
name = "lyra-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# staticlib+cdylib are the Swift app's link artifacts; rlib lets Rust
# binaries in this workspace (lyrad, tests) link the same FFI surface.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lyrad"
path = "src/bin/lyrad.rs"

[dependencies]
lyra-core = { path = "../lyra-core" }
lyra-formats = { path = "../lyra-formats" }
lyra-remote = { path = "../lyra-remote" }
lyra-fs = { path = "../lyra-fs" }
lyra-engine = { path = "../lyra-engine" }
lyra-store = { path = "../lyra-store" }
lyra-torrent = { path = "../lyra-torrent" }
lyra-search = { path = "../lyra-search" }
lyra-ipc = { path = "../lyra-ipc" }
lyra-coach = { path = "../lyra-coach" }
lyra-map = { path = "../lyra-map" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Global allocator for the Rust core: mimalloc cuts footprint/fragmentation
# vs macOS's allocator for this alloc pattern (small blocks, stream buffers).
mimalloc = "0.1"

[lints]
workspace = true
