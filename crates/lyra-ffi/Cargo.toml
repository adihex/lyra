[package]
name = "lyra-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
lyra-core = { path = "../lyra-core" }
lyra-formats = { path = "../lyra-formats" }
lyra-remote = { path = "../lyra-remote" }
lyra-fs = { path = "../lyra-fs" }
lyra-engine = { path = "../lyra-engine" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Global allocator for the Rust core: mimalloc cuts footprint/fragmentation
# vs macOS's allocator for this alloc pattern (small blocks, stream buffers).
mimalloc = "0.1"
