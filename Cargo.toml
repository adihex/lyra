[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Workspace-wide lint gates — every crate opts in via `[lints] workspace =
# true`, and CI runs `cargo clippy -- -D warnings`, so these (plus all
# default clippy/rustc warnings) fail the build rather than rotting.
[workspace.lints.rust]
# Unsafe blocks must stay explicit inside `unsafe fn` bodies — the FFI
# boundary dereferences raw pointers throughout; implicit unsafe ops
# would hide new ones from review.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every public unsafe FFI function documents its pointer contract for
# the Swift side (see lyra-ffi `# Safety` sections).
missing_safety_doc = "deny"
# Raw-pointer params must mean `unsafe fn` — soundness, not style.
not_unsafe_ptr_arg_deref = "deny"
# Never hold a std Mutex/RwLock guard across `.await` (search fan-out
# would stall provider re-registration).
await_holding_lock = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sha2 = "0.10"
rustfft = "6"
zstd = "0.14"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"   # keep unwind so a DSP/format bug can't take the process down across FFI
strip = true
opt-level = "s"    # size by default; hot paths overridden below

# Decode/DSP hot paths stay at full optimization — size where it doesn't
# cost latency, speed where it does. (profile.package needs exact names.)
[profile.release.package.symphonia]
opt-level = 3
[profile.release.package.symphonia-core]
opt-level = 3
[profile.release.package.symphonia-bundle-flac]
opt-level = 3
[profile.release.package.symphonia-bundle-mp3]
opt-level = 3
[profile.release.package.symphonia-codec-aac]
opt-level = 3
[profile.release.package.symphonia-codec-alac]
opt-level = 3
[profile.release.package.symphonia-codec-vorbis]
opt-level = 3
[profile.release.package.symphonia-codec-pcm]
opt-level = 3
[profile.release.package.symphonia-codec-adpcm]
opt-level = 3
[profile.release.package.symphonia-codec-wavpack]
opt-level = 3
[profile.release.package.symphonia-format-isomp4]
opt-level = 3
[profile.release.package.symphonia-format-ogg]
opt-level = 3
[profile.release.package.symphonia-format-riff]
opt-level = 3
[profile.release.package.ape-decoder]
opt-level = 3
[profile.release.package.opusic-sys]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
[profile.release.package.lyra-core]
opt-level = 3
[profile.release.package.lyra-formats]
opt-level = 3
[profile.release.package.lyra-dsp]
opt-level = 3
[profile.release.package.lyra-viz]
opt-level = 3
[profile.release.package.lyra-fs]
opt-level = 3
[profile.release.package.lyra-map]
opt-level = 3
