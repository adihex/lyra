# Lyra API surface — OpenAPI projection of the real in-repo protocols.
#
# TRANSPORT NOTE (read first): Lyra currently exposes NO HTTP server.
# - Local control is `lyra-ipc`: NDJSON protocol v2 over a Unix domain
#   socket (see crates/lyra-ipc/src/protocol.rs, server.rs, paths.rs).
#   Envelope: {"version":2,"id":<client>,"method":<verb>,"params":{…}}.
#   Socket discovery: $LYRA_SOCKET, else the default socket path;
#   liveness sidecar at control.sock.json. First line per connection is
#   a `hello` object {version, hello:{app:"lyra",protocol:2,…}}.
# - LAN remote is `lyra-remote`: raw TCP + SPAKE2(6-digit code) pairing →
#   Noise_XXpsk3 → pinned X25519 device keys → Noise_XX reconnects with
#   length-prefixed AEAD frames carrying JSON PlayerCommands
#   (see crates/lyra-remote/src/lib.rs, tests/pairing.rs).
#   There is no axum/router/REST layer; do not treat the paths below as
#   live HTTP routes.
#
# This file projects every real method/op onto POST paths so schema tooling
# (linters, codegen, agent clients) has one machine-readable contract.
# Names, params, and error codes mirror OPERATIONS in
# crates/lyra-ipc/src/protocol.rs and PlayerCommand in
# crates/lyra-core/src/lib.rs exactly. `operation.submit` is the generic
# entry point; bare op names are accepted as convenience aliases (server.rs).

openapi: 3.0.3
info:
  title: Lyra control API (IPC + remote projection)
  version: 2.0.0
  description: >
    Machine-readable projection of the lyra-ipc NDJSON method table
    (protocol v2) and the lyra-remote Noise command surface. Wire
    transports are a Unix socket and encrypted TCP respectively — see
    TRANSPORT NOTE above. Responses echo `id` + `version`; mutating ops
    echo a post-commit `snapshot`; long-running ops (library.scan,
    torrent.add) return retained jobs. Error taxonomy: match `code`,
    never parse `message`; `retryable` is true only for conflict/busy.
  contact:
    name: Lyra
servers:
  - url: ipc://lyra-control-socket
    description: lyra-ipc Unix domain socket (NDJSON, one object per line)
  - url: noise-tcp://lyra-remote
    description: lyra-remote encrypted TCP session (post-pairing)
paths:
  /v2/capabilities:
