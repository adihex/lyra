      summary: Send a PlayerCommand inside an established encrypted session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Sink response, e.g. {"ok":true,…}
          content:
            application/json:
              schema:
