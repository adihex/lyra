          application/json:
            schema:
              type: object
              required: [version, id, method, params]
              properties:
                version:
                  type: integer
                  example: 2
                id:
                  $ref: '#/components/schemas/Id'
                method:
                  type: string
                  example: operation.submit
                params:
                  type: object
                  required: [operation]
                  properties:
                    operation:
                      type: string
                      example: queue.enqueue
                    params:
                      type: object
                    if_revision:
                      type: integer
                    if_playlist_revision:
                      type: integer
      responses:
        '200':
          description: Inline job envelope (ok_job) or error incl. conflict on stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '409':
          description: Stale if_revision / if_playlist_revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
