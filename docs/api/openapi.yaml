  # lyra-remote pairing/handshake (Noise TCP, NOT HTTP — documented here for completeness)
  /remote/pair:
    post:
      operationId: remotePair
      summary: Open pairing (host shows 6-digit code) then SPAKE2 → Noise_XXpsk3 handshake
      description: >
        Plain-TCP hello frame {"op":"pair","name":…} → SPAKE2 message
        exchange keyed by the shown code → Noise_XXpsk3 handshake (psk =
        sha256(SPAKE2 output)) → host pins the client's X25519 static as a
        device record (paired-devices.json, 0600, survives restarts).
        Wrong code → {"error":"bad_code"}; closed window →
        {"error":"pairing_closed"}; >5 failures/min per IP throttles.
        Max 4 concurrent connections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name:
                  type: string
                  description: Display claim (identity is the pinned key, not the name)
                code:
                  type: string
                  description: 6-digit code from host.open_pairing()
      responses:
        '200':
          description: First encrypted frame {event:"paired", fp:<host fingerprint>}
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: string
                    example: paired
                  fp:
                    type: string
  /remote/connect:
    post:
      operationId: remoteConnect
      summary: Reconnect a pinned device via Noise_XX (no code)
      description: >
        Plain-TCP hello {"op":"connect"} → Noise_XX handshake → host checks
        the client static against the pinned device store; unknown keys are
        closed without entering the command loop. Clients should TOFU-pin
        the host static learned at pairing (Session::host_static).
      responses:
        '200':
          description: First encrypted frame {event:"connected", fp}
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: string
                    example: connected
                  fp:
                    type: string
  /remote/command:
    post:
