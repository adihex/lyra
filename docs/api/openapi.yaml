components:
  schemas:
    Id:
      description: Client-chosen correlation id, echoed verbatim (string or number)
      example: abc-123
    Envelope:
      type: object
      required: [version, id, method]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        method:
          type: string
          example: state.get
        params:
          type: object
    ErrorCode:
      type: string
      enum: [not_found, conflict, invalid_param, not_running, job_failed, permission_denied, busy, unknown_method, parse_error, internal]
    ErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retryable:
          type: boolean
          description: True only for conflict/busy
    ErrorResponse:
      type: object
      required: [version, id, ok, error]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
    OkResult:
      type: object
      required: [version, id, ok, result]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: true
        result:
          type: object
    SnapshotResponse:
      type: object
      required: [version, id, ok, snapshot]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: true
        snapshot:
          type: object
    SubscribedResponse:
      type: object
      required: [version, id, ok, subscribed]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: true
        subscribed:
          type: array
          items:
            type: string
    CapabilitiesResult:
      type: object
      required: [version, id, ok, result, operations]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: true
        result:
          type: object
          properties:
            protocol:
              type: integer
              example: 2
            version:
              type: string
        operations:
          type: array
          items:
            type: object
            required: [name, params]
            properties:
              name:
                type: string
              params:
                type: object
    JobResponse:
      type: object
      required: [version, id, ok, job]
      properties:
        version:
          type: integer
          example: 2
        id:
          $ref: '#/components/schemas/Id'
        ok:
          type: boolean
          example: true
        job:
          type: object
          properties:
            id:
              type: string
            operation:
              type: string
            state:
              type: string
              enum: [pending, running, succeeded, failed, cancelled]
            result:
              type: object
        snapshot:
          type: object
          description: Post-commit snapshot on mutating/async-submit ops
    PlayerCommand:
      description: lyra-core PlayerCommand (serde tag `command`, camelCase) sent inside the encrypted remote session
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [play, toggle, next, prev, seek, volume, mute, stopAfterCurrent, queueAdd]
      example:
        command: toggle
    PlayerEvent:
      description: Engine push events (serde tag `event`, camelCase)
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [state, trackChanged, queueChanged, error]
    PushEvent:
      description: IPC broadcast event on subscribed connections (monotonic seq)
      type: object
      required: [version, type, seq, topic, data]
      properties:
        version:
          type: integer
          example: 2
        type:
          type: string
          example: event
        seq:
          type: integer
        topic:
          type: string
          example: runtime.state
        data:
          type: object
