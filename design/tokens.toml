# Lyra design tokens — the single source of truth for both shells.
#
# One [palette.scheme] table per palette × appearance. Keys are the
# LyraColors roles (chassis, tray, keycap, accent, legend, onAccent, tint,
# onTint, secondaryInk, companion, border — snake_case here, camelCase in
# the generated Swift). `dim` is a GTK-only derived ink; the Swift
# generator ignores it.
#
# Regenerate after editing:  make tokens
# (scripts/gen_design_tokens.py stamps the marked blocks in
# app/Sources/LyraApp/LyraTheme.swift and crates/lyra-ui/src/design.rs)

[meta]
# GTK shell default palette row → `PALETTE` in design.rs.
gtk_default = "lavender.dark"

[roles]
# Canonical role order — generator emits keys in this sequence.
list = [
  "chassis", "tray", "keycap", "accent", "legend", "on_accent",
  "tint", "on_tint", "secondary_ink", "companion", "border", "dim",
]

[lavender.light]
chassis = "#F3F0F7"
tray = "#E0D9E9"
keycap = "#FDFCFF"
accent = "#C5B3D8"
legend = "#4A3C60"
on_accent = "#30263F"
tint = "#665379"
on_tint = "#FFFFFF"
secondary_ink = "#495F62"
companion = "#C0D7D0"
border = "#B8AAC7"
dim = "#665379"

