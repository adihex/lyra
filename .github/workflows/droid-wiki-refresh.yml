name: Droid Wiki Refresh

on:
  push:
    branches: [master]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Factory Droid
        # Pinned release download + sha256 verification (no piped installer).
        run: |
          VER="0.223.0"
          ARCH="x64"
          grep -qi avx2 /proc/cpuinfo || ARCH="x64-baseline"
          BASE="https://downloads.factory.ai/factory-cli/releases/${VER}/linux/${ARCH}"
          curl -fsSL -o /tmp/droid "$BASE/droid"
          curl -fsSL -o /tmp/droid.sha256 "$BASE/droid.sha256"
          echo "$(cat /tmp/droid.sha256)  /tmp/droid" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/droid "$HOME/.local/bin/droid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate wiki
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
