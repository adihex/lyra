name: release

# Tag push `v*` or manual dispatch → release Rust core → swiftc →
# ad-hoc-signed .app → UDZO dmg. Ad-hoc signing means Gatekeeper shows
# "unidentified developer" on first open (right-click → Open). The
# Developer ID + notarization path needs Apple secrets — see BLUEPRINT §6.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the bundle (e.g. 0.2.0)
        required: true
      create_release:
        description: Also create a GitHub release (defaults on for tags)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust + cmake + ninja from mise.toml. CARGO=cargo skips the mbx
      # shim so rust-cache can cache target/ as a normal directory.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Version stamp
        env:
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          echo "version=$V" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$V" Info.plist
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" Info.plist

      - name: Build app (release)
        run: make app PROFILE=release CARGO=cargo

      - name: Package DMG
        run: |
          mkdir -p .build/dmg
          cp -R .build/Lyra.app .build/dmg/
          ln -s /Applications .build/dmg/Applications
          hdiutil create -volname "Lyra" -srcfolder .build/dmg \
            -ov -format UDZO ".build/Lyra-${version}.dmg"
          shasum -a 256 ".build/Lyra-${version}.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lyra-${{ env.version }}-dmg
          path: .build/Lyra-*.dmg
          if-no-files-found: error

      - name: Attach to GitHub release
        if: >-
          github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${version}"
          fi
          # create handles the tag not existing yet (dispatch runs);
          # upload --clobber covers re-runs where the release exists.
          gh release create "$TAG" .build/Lyra-*.dmg \
            --title "Lyra $TAG" --generate-notes 2>/dev/null \
          || gh release upload "$TAG" .build/Lyra-*.dmg --clobber
